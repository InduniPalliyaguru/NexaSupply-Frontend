<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexaSupply - Account Pending Approval</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Theme Specific CSS -->
    <link rel="stylesheet" href="../../css/admin.css">

    <style>
        body {
            background-color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 1.5rem;
        }

        .pending-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            max-width: 480px;
            width: 100%;
            overflow: hidden;
        }

        .pending-icon-wrapper {
            width: 90px;
            height: 90px;
            background-color: #fef3c7;
            color: #d97706;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem auto;
            animation: pulse-amber 2s infinite;
        }

        @keyframes pulse-amber {
            0% {
                box-shadow: 0 0 0 0 rgba(217, 119, 6, 0.4);
            }
            70% {
                box-shadow: 0 0 0 18px rgba(217, 119, 6, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(217, 119, 6, 0);
            }
        }

        .status-badge-pending {
            background-color: #fef3c7;
            color: #d97706;
            font-size: 0.85rem;
            font-weight: 700;
            padding: 0.5em 1.2em;
            border-radius: 50px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-block;
        }
    </style>
</head>
<body>

<div class="pending-card p-4 p-sm-5 text-center">

    <!-- BRAND LOGO -->
    <div class="d-flex align-items-center justify-content-center gap-2 mb-4">
        <img src="../../images/logo.png" alt="NexaSupply Logo" style="height: 38px;"
             onerror="this.style.display='none';">
        <span class="fw-bold fs-4" style="color: var(--nexa-dark, #0f172a);">NexaSupply</span>
    </div>

    <!-- PENDING ANIMATED ICON -->
    <div class="pending-icon-wrapper">
        <i class="fa-solid fa-clock-rotate-left fs-1"></i>
    </div>

    <!-- MAIN HEADING & STATUS BADGE -->
    <h4 class="fw-bold text-dark mb-3">Account Pending Approval</h4>

    <div class="mb-3">
        <span class="status-badge-pending">
            <i class="fa-solid fa-hourglass-half me-1"></i> PENDING APPROVAL
        </span>
    </div>

    <p class="text-muted small mb-4">
        Your retailer account is currently under administrative review. You will gain full access to the system once your account is verified by an admin.
    </p>

    <!-- BACK TO LOGIN BUTTON -->
    <button type="button" class="btn btn-primary rounded-pill py-2.5 fw-semibold w-100" onclick="goToLogin()">
        <i class="fa-solid fa-arrow-left me-2"></i> Back to Login Page
    </button>

    <!-- SUPPORT CONTACT -->
    <div class="mt-4 pt-3 border-top text-muted small">
        Need assistance? Contact Administrator at<br>
        <a href="mailto:support@nexasupply.com" class="text-decoration-none fw-semibold">support@nexasupply.com</a>
    </div>

</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Clear session and return to Login
    function goToLogin() {
        localStorage.clear();
        window.location.href = '../../index.html';
    }
</script>

</body>
</html>
