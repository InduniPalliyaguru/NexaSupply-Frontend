<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexaSupply - Login & Registration</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Clear Overlay over Background Image -->
<div class="bg-overlay"></div>

<div class="main-content-container">

    <!-- TOP BRANDING & LOGO -->
    <div class="text-center mb-4">
        <div class="d-flex align-items-center justify-content-center mb-2">
            <!-- Large Logo Image (Height: 130px) -->
            <img src="images/logo.png" alt="NexaSupply Logo" class="big-logo-img"
                 onerror="this.style.display='none'; document.getElementById('alt-icon').style.display='inline-block';">
            <i id="alt-icon" class="fa-solid fa-boxes-packing fa-4x"
               style="color: var(--nexa-primary); display: none;"></i>
        </div>

        <!-- Stylish Gradient Brand Name -->
        <h1 class="brand-name mb-0">NexaSupply</h1>

        <h2 id="formTitle" class="form-heading mt-3 mb-2">Login</h2>

        <p id="togglePrompt" class="text-muted small mb-4">
            Don't have an account? <a href="javascript:void(0)" onclick="toggleAuthMode()" class="toggle-auth-link">Create
            your account</a>, it takes less than a minute.
        </p>
    </div>

    <!-- ALERT BOX FOR MESSAGES -->
    <div id="authAlert" class="alert alert-danger py-2 small d-none text-center mb-3" role="alert">
        <span id="alertMessage"></span>
    </div>

    <!-- ================= 1. LOGIN FORM ================= -->
    <div id="loginSection">
        <form id="loginForm" onsubmit="handleLogin(event)">

            <!-- Email Input -->
            <div class="pill-input-group">
                <i class="fa-solid fa-envelope input-icon"></i>
                <input type="email" class="pill-control" id="loginEmail" placeholder="yourmail@company.com" required>
            </div>

            <!-- Password Input with Eye Toggle -->
            <div class="pill-input-group">
                <i class="fa-solid fa-lock input-icon"></i>
                <input type="password" class="pill-control" id="loginPassword" placeholder="Password" required>
                <i class="fa-solid fa-eye-slash password-toggle"
                   onclick="togglePasswordVisibility('loginPassword', this)"></i>
            </div>

            <!-- Remember me & Forgot Password -->
            <div class="d-flex justify-content-between align-items-center mb-4 px-2 small text-muted">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="rememberMe">
                    <label class="form-check-label" for="rememberMe">Remember me</label>
                </div>
                <a href="#" class="text-muted text-decoration-none">Forgot password?</a>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-pill-primary">
                <i class="fa-solid fa-right-to-bracket me-2"></i> Login
            </button>
        </form>
    </div>

    <!-- ================= 2. SIGNUP FORM ================= -->
    <div id="signupSection" style="display: none;">
        <form id="registerForm" onsubmit="handleRegister(event)">

            <!-- Full Name -->
            <div class="pill-input-group">
                <i class="fa-solid fa-user input-icon"></i>
                <input type="text" class="pill-control" id="regFullName" placeholder="Full Name" required>
            </div>

            <!-- Email Address -->
            <div class="pill-input-group">
                <i class="fa-solid fa-envelope input-icon"></i>
                <input type="email" class="pill-control" id="regEmail" placeholder="Email Address" required>
            </div>

            <!-- Shop Name -->
            <div class="pill-input-group">
                <i class="fa-solid fa-store input-icon"></i>
                <input type="text" class="pill-control" id="regShopName" placeholder="Shop / Business Name" required>
            </div>

            <!-- Phone Number -->
            <div class="pill-input-group">
                <i class="fa-solid fa-phone input-icon"></i>
                <input type="text" class="pill-control" id="regPhone" placeholder="Phone Number" required>
            </div>

            <!-- Address -->
            <div class="pill-input-group">
                <i class="fa-solid fa-location-dot input-icon"></i>
                <input type="text" class="pill-control" id="regAddress" placeholder="Address / City" required>
            </div>

            <!-- Password with Eye Toggle -->
            <div class="pill-input-group mb-4">
                <i class="fa-solid fa-lock input-icon"></i>
                <input type="password" class="pill-control" id="regPassword" placeholder="Create Password" required>
                <i class="fa-solid fa-eye-slash password-toggle"
                   onclick="togglePasswordVisibility('regPassword', this)"></i>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-pill-primary">
                <i class="fa-solid fa-user-plus me-2"></i> Create Account
            </button>
        </form>
    </div>

    <!-- FOOTER COPYRIGHT -->
    <div class="copyright-text">
        &copy; 2026 NexaSupply Systems Ltd. All rights reserved.
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>

<script>
    function togglePasswordVisibility(inputId, iconElem) {
        const input = document.getElementById(inputId);
        if (input.type === "password") {
            input.type = "text";
            iconElem.classList.remove("fa-eye-slash");
            iconElem.classList.add("fa-eye");
        } else {
            input.type = "password";
            iconElem.classList.remove("fa-eye");
            iconElem.classList.add("fa-eye-slash");
        }
    }

    let isSignUp = false;

    function toggleAuthMode() {
        isSignUp = !isSignUp;
        const loginSec = document.getElementById('loginSection');
        const signupSec = document.getElementById('signupSection');
        const formTitle = document.getElementById('formTitle');
        const togglePrompt = document.getElementById('togglePrompt');

        if (isSignUp) {
            loginSec.style.display = 'none';
            signupSec.style.display = 'block';
            formTitle.innerText = "Sign Up";
            togglePrompt.innerHTML = 'Already have an account? <a href="javascript:void(0)" onclick="toggleAuthMode()" class="toggle-auth-link">Login here</a>';
        } else {
            loginSec.style.display = 'block';
            signupSec.style.display = 'none';
            formTitle.innerText = "Login";
            togglePrompt.innerHTML = 'Don\'t have an account? <a href="javascript:void(0)" onclick="toggleAuthMode()" class="toggle-auth-link">Create your account</a>, it takes less than a minute.';
        }
    }
</script>
</body>
</html>
